<?xml version="1.0" encoding="utf-8"?>

<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

<svg version="1.1"
     id="Layer_1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     x="0px"
     y="0px"
     width="500.0px"
     height="500.0px"
     viewBox="0 0 500 500"
     enable-background="new 0 0 500 500"
     xml:space="preserve">


<!-- Whole robot -->
<g transform="translate(250 250)">

    <!-- TORSO -->

    <!-- torso left half -->
    <polygon fill="#00A651"
             points="-50,-50 0,-50 -50,50"/>

    <polygon fill="#00A651"
             points="-50,50 0,-50 0,50"/>


    <!-- torso right half -->
    <polygon fill="#2B2B2B"
             points="0,-50 50,-50 0,50"/>

    <polygon fill="#2B2B2B"
             points="0,50 50,-50 50,50"/>


    <!-- left chest accent -->
    <polygon fill="#D9A300"
             points="-40,-35 -10,-35 -20,-15 -45,-15"/>

    <!-- right chest accent -->
    <polygon fill="#7E3FF2"
             points="10,-35 40,-35 45,-15 20,-15"/>

    <!-- HEAD -->

    <g transform="translate(0 -100)">

        <!-- slight head tilt -->
        <g transform="rotate(-5)">

            <!-- original diamond rotation -->
            <g transform="rotate(45)">

                <g transform="scale(.5 .5)">

                    <!-- left head -->
                    <polygon fill="#00A651"
                             points="-50,-50 0,-50 -50,50"/>

                    <polygon fill="#00A651"
                             points="-50,50 0,-50 0,50"/>


                    <!-- right head -->
                    <polygon fill="#2B2B2B"
                             points="0,-50 50,-50 0,50"/>

                    <polygon fill="#2B2B2B"
                             points="0,50 50,-50 50,50"/>

                </g>

            </g>

        </g>

    </g>
    <!-- LEFT LEG -->

    <g transform="translate(-40 90)">

        <g transform="rotate(-8)">

            <!-- upper leg -->
            <g transform="scale(.2 .6)">

                <polygon fill="#00A651"
                         points="-50,-50 50,-50 -50,50"/>

                <polygon fill="#007A3D"
                         points="-50,50 50,-50 50,50"/>

            </g>


            <!-- lower leg -->
            <g transform="translate(0 70)">

                <g transform="rotate(8)">

                    <g transform="scale(.2 .6)">

                        <polygon fill="#00A651"
                                 points="-50,-50 50,-50 -50,50"/>

                        <polygon fill="#007A3D"
                                 points="-50,50 50,-50 50,50"/>

                    </g>

                </g>

            </g>

        </g>

    </g>
    <!-- RIGHT LEG -->

    <g transform="translate(40 90)">

        <g transform="rotate(3)">

            <!-- upper leg -->
            <g transform="scale(.2 .6)">

                <polygon fill="#2B2B2B"
                         points="-50,-50 50,-50 -50,50"/>

                <polygon fill="#111111"
                         points="-50,50 50,-50 50,50"/>

            </g>


            <!-- lower leg -->
            <g transform="translate(0 70)">

                <g transform="scale(.2 .6)">

                    <polygon fill="#2B2B2B"
                             points="-50,-50 50,-50 -50,50"/>

                    <polygon fill="#111111"
                             points="-50,50 50,-50 50,50"/>

                </g>

            </g>

        </g>

    </g>
    <!-- LEFT ARM -->

    <g transform="translate(-90 -40)">

        <!-- rotate entire arm downward -->
        <g transform="rotate(-70)">

            <!-- upper arm -->
            <g transform="scale(.6 .2)">

                <polygon fill="#00A651"
                         points="-50,-50 50,-50 -50,50"/>

                <polygon fill="#007A3D"
                         points="-50,50 50,-50 50,50"/>

            </g>


            <!-- forearm -->
            <g transform="translate(-70 0)">

                <g transform="rotate(10)">

                    <g transform="scale(.6 .2)">

                        <polygon fill="#00A651"
                                 points="-50,-50 50,-50 -50,50"/>

                        <polygon fill="#007A3D"
                                 points="-50,50 50,-50 50,50"/>

                    </g>

                </g>

            </g>

        </g>

    </g>



    <!-- ==================== RIGHT ARM ==================== -->

    <g transform="translate(90 -40)">

        <!-- raise upper arm -->
        <g transform="rotate(-25)">

            <!-- upper arm -->
            <g transform="scale(.6 .2)">

                <polygon fill="#2B2B2B"
                         points="-50,-50 50,-50 -50,50"/>

                <polygon fill="#4B1A8A"
                         points="-50,50 50,-50 50,50"/>

            </g>


            <!-- forearm -->
            <g transform="translate(70 0)">

                <g transform="rotate(-15)">

                    <g transform="scale(.6 .2)">

                        <polygon fill="#2B2B2B"
                                 points="-50,-50 50,-50 -50,50"/>

                        <polygon fill="#7E3FF2"
                                 points="-50,50 50,-50 50,50"/>

                    </g>

                </g>

            </g>

        </g>

    </g>


</g>
<!-- end whole robot -->


</svg>